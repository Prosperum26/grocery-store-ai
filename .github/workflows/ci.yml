# CI cho ai-service: chạy pytest trên thư mục tests/.
# Test không cần ai_db hay model thật (test cần dữ liệu Instacart tự skip khi thiếu data/raw).
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # torch bản CPU trước để không kéo bộ CUDA vài GB về runner.
      - name: Install dependencies
        run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Pytest
        run: python -m pytest tests -q
